  /* ===============================
   FONDO DIFUSO MULTICOLOR (CENTRADO)
   =============================== */

#luma-bg {
  position: fixed;
  inset: 0;
  z-index: -999;
  pointer-events: none;
  overflow: hidden;
  background: #000;
}

.luma-blob {
  position: absolute;
  width: 70vmax;
  height: 70vmax;
  max-width: 800px;
  max-height: 800px;
  border-radius: 50%;
  opacity: 0.75;
  mix-blend-mode: screen;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  filter: blur(100px);

  /* Animación combinada: movimiento + rotación */
  animation: blobAnimation 40s ease-in-out infinite alternate,
             colorChange 20s ease-in-out infinite alternate;
}

/* Diferentes duraciones para cada blob */
.luma-blob.b1 { background: #7f0000; animation-duration: 38s, 18s; }
.luma-blob.b2 { background: #007f00; animation-duration: 42s, 22s; }
.luma-blob.b3 { background: #00007f; animation-duration: 36s, 20s; }

/* Animación combinada: movimiento + giro */
@keyframes blobAnimation {
  0%   { transform: translate(-50%, -50%) translateX(-15%) translateY(-10%) scale(0.5) rotate(0deg); }
  25%  { transform: translate(-50%, -50%) translateX(10%) translateY(15%) scale(0.8) rotate(90deg); }
  50%  { transform: translate(-50%, -50%) translateX(5%) translateY(-10%) scale(0.3) rotate(180deg); }
  75%  { transform: translate(-50%, -50%) translateX(-10%) translateY(10%) scale(0.4) rotate(270deg); }
  100% { transform: translate(-50%, -50%) translateX(-15%) translateY(-5%) scale(0.6) rotate(360deg); }
}

/* Cambio suave de color */
@keyframes colorChange {
  0%   { filter: blur(100px) hue-rotate(0deg); }
  50%  { filter: blur(100px) hue-rotate(180deg); }
  100% { filter: blur(100px) hue-rotate(360deg); }
}

    /* TRANSICIONES CABECERA Y FOOTER */

      box-shadow: 0 1px 0 rgba(255,255,255,.06) inset, 0 10px 30px rgba(0,0,0,.06);
      overflow: clip;
      isolation: isolate;
    }

    .glass-header::before,
    footer::before {
      content: "";
      position: absolute;
      inset: -40% -10%;
      pointer-events: none;
      background: radial-gradient(200px 200px at var(--mx) var(--my), rgba(var(--ring)/.55), transparent 60%);
      filter: blur(18px) saturate(130%);
      opacity: 0;
      transition: opacity .25s ease;
      mix-blend-mode: screen;
    }

    .glass-header.is-hot::before,
    footer.is-hot::before {
      opacity: 1;
    }

    .brand {

    .title {

      align-self: start; /* título más arriba */

    /* BOTONES CABECERA */

    /* GALERÍA DE IFRAMES */
    main {

    .iframe-grid {

  <script>
    const iframes = document.querySelectorAll('.iframe-grid iframe');
    iframes.forEach((iframe, i) => { iframe.style.animationDelay = `${i * 0.1}s`; });

    const header = document.getElementById('cabecera');
    const footer = document.getElementById('footer');

    function throttle(fn, wait){
      let last = 0, rafId = null, pendingArgs = null;
      return function(...args){
        const now = performance.now();
        pendingArgs = args;
        if (now - last >= wait) {
          last = now;
          fn.apply(this, pendingArgs);
          pendingArgs = null;
        } else if (!rafId) {
          rafId = requestAnimationFrame(() => {
            rafId = null; last = performance.now();
            if (pendingArgs) { fn.apply(this, pendingArgs); pendingArgs = null; }
          });
        }
      };
    }

    function updateLight(el, clientX, clientY){
      const rect = el.getBoundingClientRect();
      const x = Math.max(0, Math.min(clientX - rect.left, rect.width));
      const y = Math.max(0, Math.min(clientY - rect.top, rect.height));
      el.style.setProperty('--mx', x + 'px');
      el.style.setProperty('--my', y + 'px');
      el.classList.toggle('edge-left', x < rect.width / 2);
      el.classList.toggle('edge-right', x >= rect.width / 2);
    }

    function bindReactiveLight(el) {
      function onMove(ev) {
        el.classList.add('is-hot');
        const clientX = ev.touches ? ev.touches[0].clientX : ev.clientX;
        const clientY = ev.touches ? ev.touches[0].clientY : ev.clientY;
        updateLight(el, clientX, clientY);
      }
      const throttledMove = throttle(onMove, 16);
      el.addEventListener('pointerenter', () => el.classList.add('is-hot'));
      el.addEventListener('pointermove', throttledMove);
      el.addEventListener('pointerleave', () => el.classList.remove('is-hot', 'edge-left', 'edge-right'));
      el.addEventListener('touchstart', throttledMove, { passive: true });
      el.addEventListener('touchmove', throttledMove, { passive: true });
      el.addEventListener('touchend', () => el.classList.remove('is-hot', 'edge-left', 'edge-right'));
    }

    bindReactiveLight(header);
    bindReactiveLight(footer);
    
    const sidebar = document.getElementById('sidebar');

bindReactiveLight(sidebar);

    const menuAnim = lottie.loadAnimation({
    container: document.getElementById("menuIcon"),
    renderer: "svg",
    loop: false,
    autoplay: false,
    path: "https://raw.githubusercontent.com/oracleibmaisd0-droid/JsonMenuLateral/main/icons8-men%C3%BA-blanco.json"
});

let mitad = 0;

menuAnim.addEventListener("DOMLoaded", () => {
    mitad = Math.floor(menuAnim.totalFrames / 2);
    menuAnim.goToAndStop(0, true);
});

function toggleMenu() {

    document.body.classList.toggle("menu-open");

    const abierto = document.body.classList.contains("menu-open");

    if (abierto) {
        menuAnim.goToAndStop(0, true);
        menuAnim.playSegments([0, mitad], true);
    } else {
        menuAnim.goToAndStop(mitad, true);
        menuAnim.playSegments([mitad, 0], true);
    }

}

        }
    }


    /*

    ==============================================
    */

    const walker = document.createTreeWalker(
        document.body,
        NodeFilter.SHOW_TEXT
    );

    const nodos = [];

    let nodo;

    while (nodo = walker.nextNode()) {

    }

            )
        ) {

            )
        ) {

        }


        const fragmento =

        const partes = texto.split(

        );


        partes.forEach(parte => {

            ) {

                const marcado =
                    document.createElement("span");

                marcado.className =
                    "palabra-marcada";

                marcado.textContent =

                    color;

                marcado.appendChild(punto);

                fragmento.appendChild(marcado);

            } else {

                fragmento.appendChild(
                    document.createTextNode(parte)
                );

            }

        });

            fragmento,
            textNode
        );
